name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Syntax check (Q3)
        run: for f in js/*.js; do node --check "$f"; done

      - name: Lint (T8)
        run: npm run lint

      - name: Unit tests (T3)
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (T4-T7)
        run: npm run test:e2e

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
