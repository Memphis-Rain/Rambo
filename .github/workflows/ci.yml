name: CI

on:
  push:
    branches: [main]
  pull_request:

# GitHub runners (2 vCPU, software WebGL) run the game 5-15x slower than a dev
# machine. The e2e suite scales its timeouts for CI (tests/e2e/fixtures.js) and is
# sharded; long perf/statistical tests (tag @perf) get their own job.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax check (Q3)
        run: for f in js/*.js; do node --check "$f"; done
      - name: Lint (T8)
        run: npm run lint
      # Spec B1: every local asset in game.html carries the one ?v=<BUILD> (runs once tools/stamp.mjs exists).
      - name: Build stamp check (B1)
        if: hashFiles('tools/stamp.mjs') != ''
        run: node tools/stamp.mjs --check
      - name: Unit tests (T3)
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests (T4-T11), shard ${{ matrix.shard }}/4
        run: npx playwright test --grep-invert "@perf|@long|G13" --shard=${{ matrix.shard }}/4
      - name: "Guard: the shard actually ran tests"
        if: success()
        run: node tests/ci/assert-ran.mjs
      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  perf:
    runs-on: ubuntu-latest
    # @perf tests measure fixed GAME time; at the runner's ~4 fps one can take ~11 min.
    # Shards run ~10-13 min (M9PERF and M11PERF, the heaviest, have their own jobs in 'long'), so 30 min
    # leaves ample headroom.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Relative criteria only on CI (Q2a); absolute ms budgets are skipped or recorded.
      - name: Perf and statistical tests (@perf, except M9PERF and M11PERF)
        run: npx playwright test --grep @perf --grep-invert "M9PERF|M11PERF" --shard=${{ matrix.shard }}/3
      - name: "Guard: the shard actually ran tests"
        if: success()
        run: node tests/ci/assert-ran.mjs
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-perf-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  long:
    runs-on: ubuntu-latest
    # The two 156-shot G13 tests (@long), one job per pixel scale so they never share a
    # runner, plus one job for the other G13 aim tests and one each for the M9 perf scene (90
    # game-s of fire + red pond; it took a perf shard from 13 to 21 min on fc8adc2) and the
    # M11 2P perf scene (90 game-s of gore at zoom 0.6).
    # Worst measured on CI before the post-FX/fit-cache speedup: x1 28.3 min, so 40 min
    # keeps >= 25% headroom even without it.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scale: [1, 3, aim, m9perf, m11perf]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: G13 head-to-toe shots at x${{ matrix.scale }} (@long)
        if: matrix.scale == 1 || matrix.scale == 3
        run: npx playwright test -g "x${{ matrix.scale }}\) @long"
      # The other G13 aim tests (real-mouse shots, several minutes each on CI) run here, so
      # they don't pile into one e2e shard.
      - name: Other G13 aim tests
        if: matrix.scale == 'aim'
        run: npx playwright test -g "G13" --grep-invert "@long"
      # The M9 sustained scene (@perf, relative ratio only on CI), alone on its runner.
      - name: M9PERF sustained scene
        if: matrix.scale == 'm9perf'
        run: npx playwright test -g "M9PERF"
      # The M11 2P sustained scene (90 game-s of gore at zoom 0.6), alone on its runner too.
      - name: M11PERF 2P sustained scene
        if: matrix.scale == 'm11perf'
        run: npx playwright test -g "M11PERF"
      - name: "Guard: the shard actually ran tests"
        if: success()
        run: node tests/ci/assert-ran.mjs
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-long-x${{ matrix.scale }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
